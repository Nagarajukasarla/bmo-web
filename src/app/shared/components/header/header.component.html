<header class="header">
  <div class="header-container">
    <!-- Left: Logo linking to Home -->
    <a routerLink="/home" class="logo-group">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="logo-text">
        <span class="logo-brand">BMO</span>
        <span class="logo-tier">PREMIUM</span>
      </div>
    </a>

    <!-- Right Actions: Search + Nav Menu -->
    <div class="header-actions">
      <!-- Search Input Container -->
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          type="text"
          placeholder="Search..."
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          (keydown.enter)="onSearch()"
          class="search-input"
          name="searchQuery"
          autocomplete="off"
        />
        @if (searchQuery) {
          <button (click)="clearSearch()" class="search-clear-btn" aria-label="Clear search">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
      </div>

      <!-- Right: Navigation Links (2 links on the right side as requested) -->
      <nav class="nav-menu">
        <a routerLink="/accounts" routerLinkActive="active" target="_blank" class="nav-link">
          <span>Accounts</span>
        </a>
        <a routerLink="/loans" routerLinkActive="active" target="_blank" class="nav-link">
          <span>Loans</span>
        </a>
      </nav>
    </div>
  </div>
</header>
